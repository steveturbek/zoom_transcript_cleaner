<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zoom Transcript Cleaner</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f5f5;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* === Drop area: full-height centering before load === */
      #drop-area {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
      }

      body.loaded #drop-area {
        flex: 0;
        padding: 0;
      }

      #dropzone {
        width: 480px;
        max-width: 100%;
        padding: 60px 40px;
        background: #fff;
        border: 2.5px dashed #ccc;
        border-radius: 12px;
        text-align: center;
        user-select: none;
        transition:
          border-color 0.15s,
          background 0.15s;
      }

      body.loaded #dropzone {
        width: 100%;
        padding: 9px 24px;
        border-radius: 0;
        border: none;
        border-bottom: 1px solid #e0e0e0;
        text-align: left;
      }

      #dropzone.dragover,
      body.loaded #dropzone.dragover {
        border: 2px solid #0057ff !important;
        background: #f0f4ff !important;
      }

      #dropzone.error {
        border-color: #dc2626;
        background: #fef2f2;
      }
      #dropzone.error #status {
        color: #dc2626;
      }

      body.loaded .drop-icon,
      body.loaded h1 {
        display: none;
      }

      .drop-icon {
        font-size: 48px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        color: #111;
        margin-bottom: 8px;
      }
      #status {
        font-size: 13px;
        color: #666;
        line-height: 1.5;
      }

      #pick-btn {
        display: inline-block;
        margin-top: 16px;
        padding: 6px 16px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 13px;
        color: #333;
        background: #fff;
        cursor: pointer;
      }

      body.loaded #pick-btn {
        margin-top: 6px;
      }

      /* === Toolbar === */
      #toolbar {
        display: none;
        background: #fff;
        border-bottom: 1px solid #e8e8e8;
        padding: 8px 24px;
        align-items: center;
        gap: 16px;
      }

      body.loaded #toolbar {
        display: flex;
      }

      #toolbar label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: #333;
        cursor: pointer;
      }

      #toolbar button {
        padding: 6px 16px;
        background: #fff;
        color: #333;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }

      #toolbar button:hover {
        background: #f5f5f5;
      }

      #toolbar button.primary {
        background: #111;
        color: #fff;
        border-color: #111;
      }

      #toolbar button.primary:hover {
        background: #444;
      }

      #host-label {
        margin-right: 8px;
      }

      /* === Transcript preview === */
      #preview-wrap {
        display: none;
        flex: 1;
        overflow-y: auto;
        padding: 40px 48px;
      }

      body.loaded #preview-wrap {
        display: block;
      }

      #preview {
        max-width: 760px;
        margin: 0 auto;
        outline: none;
        font-size: 15px;
        line-height: 1.8;
        color: #1a1a1a;
      }

      #preview p {
        margin-bottom: 0.85em;
      }
      #preview p:last-child {
        margin-bottom: 0;
      }

      /* === Phone layout (after base rules so it overrides them) === */
      @media (max-width: 600px) {
        #drop-area {
          padding: 16px;
        }
        #toolbar {
          flex-wrap: wrap;
          padding: 8px 16px;
          gap: 8px;
        }
        body.loaded #dropzone {
          padding: 9px 16px;
        }
        #preview-wrap {
          padding: 20px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div id="drop-area">
      <div id="dropzone">
        <div class="drop-icon">📄</div>
        <h1>Zoom Transcript Cleaner</h1>
        <p id="status">Drop the <strong>Zoom meeting folder</strong> or its transcript <strong>.txt</strong> anywhere on this page</p>
        <label id="pick-btn">
          Choose file…
          <input type="file" id="file-input" accept=".txt,text/plain" hidden />
        </label>
      </div>
    </div>

    <div id="toolbar">
      <label id="host-label">
        Host
        <select id="host-select"></select>
      </label>
      <button id="guest-txt-btn" class="primary">Download guest only .txt</button>
      <button id="md-btn" class="primary">Download conversation .md</button>
      <button id="copy-btn">Copy Speaker Text with AI Quote Finder Prompt</button>
    </div>

    <div id="preview-wrap">
      <div id="preview" contenteditable="true" spellcheck="false"></div>
    </div>

    <script>
      // Host is picked from the transcript's speakers; the choice is remembered in this browser
      const HOST_KEY = "zoom-transcript-cleaner-host";
      let loaded = null; // { rows, fillerPct, displayName }
      // Old format: "[Name] 13:36:28" line, then text lines
      const SPEAKER_LINE = /^\[(.+?)\]\s+\d+:\d+:\d+\s*$/;
      // New format (2026): "14:03:10 --> 14:03:12" line, then "Name: text"
      const TIME_RANGE_LINE = /^\d+:\d+:\d+(?:[.,]\d+)?\s*-->\s*\d+:\d+:\d+(?:[.,]\d+)?\s*$/;
      const NAME_PREFIX = /^([^:]{1,80}?):\s+(.*)$/;

      // Case-insensitive: entries are lowercased below, sentences are lowercased before lookup
      const FILLER_LIST = [
        "absolutely.",
        "ah, cool.",
        "all right!",
        "all right, cool.",
        "All right, uh…",
        "all right.",
        "alright.",
        "and so…",
        "and, um…",
        "And…",
        "awesome!",
        "awesome.",
        "Beautiful.",
        "Cool.",
        "Definitely.",
        "exactly.",
        "fantastic.",
        "great.",
        "hmm!",
        "hmm, mm-hmm.",
        "hmm.",
        "hmm...",
        "hmm…",
        "huh.",
        "Interesting.",
        "it's okay.",
        "laughter.",
        "love it.",
        "Mm-hmm, sure.",
        "mm-hmm.",
        "Mmhm.",
        "Nope.",
        "oh okay!",
        "oh okay.",
        "Oh, awesome.",
        "Oh, cool.",
        "oh, good point.",
        "oh, great.",
        "oh, nice.",
        "oh, okay!",
        "oh, okay.",
        "Oh, that's awesome.",
        "Oh, totally.",
        "oh, yeah, sure.",
        "oh, yeah, yeah, yeah.",
        "oh, yeah.",
        "Oh.",
        "okay!",
        "okay, awesome.",
        "okay, hmm.",
        "okay, love it.",
        "okay, so…",
        "okay, that's fine.",
        "okay, that's great.",
        "Okay, yeah.",
        "okay.",
        "ooh.",
        "Right, right.",
        "right.",
        "right?",
        "so.",
        "so…",
        "sure!",
        "Sure, um…",
        "sure.",
        "that's awesome.",
        "that's fantastic.",
        "That's fascinating.",
        "that's great.",
        "that's insane.",
        "That's… that's awesome.",
        "totally good.",
        "Totally.",
        "uh-huh.",
        "um, so…",
        "um.",
        "wow!",
        "wow, okay.",
        "wow, that's incredible.",
        "wow.",
        "yeah!",
        "yeah,",
        "yeah, absolutely.",
        "yeah, definitely.",
        "yeah, exactly.",
        "yeah, go ahead.",
        "yeah, got it.",
        "yeah, no, that's awesome.",
        "yeah, same, same.",
        "yeah, so…",
        "yeah, that's awesome.",
        "yeah, that's cool.",
        "yeah, that's nice.",
        "yeah, well…",
        "yeah, yeah, yeah, yeah.",
        "yeah, yeah, yeah.",
        "yeah, yeah.",
        "yeah.",
        "yep.",
        "yes.",
        "you know.",
      ];
      const FILLERS = new Set(FILLER_LIST.map((f) => f.toLowerCase().trim()));

      let baseFilename = "transcript";

      function parse(raw) {
        const lines = raw.split(/\r?\n/);
        const entries = [];
        let current = null;
        let afterTimeRange = false;

        for (const line of lines) {
          const m = line.match(SPEAKER_LINE);
          if (m) {
            if (current) entries.push(current);
            current = { speaker: m[1].trim(), parts: [] };
            afterTimeRange = false;
          } else if (TIME_RANGE_LINE.test(line)) {
            if (current) entries.push(current);
            current = null;
            afterTimeRange = true;
          } else if (afterTimeRange && line.trim()) {
            const n = line.trim().match(NAME_PREFIX);
            current = n ? { speaker: n[1].trim(), parts: [n[2]] } : { speaker: "Unknown", parts: [line.trim()] };
            afterTimeRange = false;
          } else if (current && line.trim()) {
            current.parts.push(line.trim());
          }
        }
        if (current) entries.push(current);
        return entries.map((e) => ({ speaker: e.speaker, text: e.parts.join(" ") }));
      }

      function removeFiller(text) {
        const sentences = text.split(/(?<=[.!?…])\s+/);
        const kept = sentences
          .filter((s) => !FILLERS.has(s.replace(/^-\s*/, "").toLowerCase().trim()))
          .map((s) => {
            const stripped = s.replace(/^(?:um|uh)(?:,|…|\.\.\.)\s*/i, "").replace(/^(?:you know,\s+)+/i, "");
            return stripped !== s ? stripped.charAt(0).toUpperCase() + stripped.slice(1) : s;
          })
          // Mid-sentence um/uh: ", um, you know" -> ", you know"; "took, um… a" / "but um, but" -> drop it;
          // at sentence end keep the final punctuation: "and then, uh." -> "and then."
          .map((s) =>
            s
              .replace(/,\s+(?:um|uh),(?=\s)/gi, ",")
              .replace(/,?\s+(?:um|uh)\b(?!-)(\.\.\.|[,.…])?(?=\s|$)/gi, (m, p, off, str) => (off + m.length >= str.length && p && p !== "," ? p : ""))
              // Comma-wrapped "like" / "you know" are filler, also back to back:
              // "the story of, like, Beyond" -> "the story of Beyond"; "is, like, you know, everyone" -> "is everyone"
              .replace(/(?:,\s+(?:like|you know))+,(?=\s)/gi, ""),
          );
        return kept.join(" ").trim();
      }

      const wc = (t) => t.split(/\s+/).filter(Boolean).length;

      function clean(entries) {
        const filtered = entries.map((e) => ({ ...e, text: removeFiller(e.text).replace(/^-\s*/, "").trim() })).filter((e) => e.text.length > 1);

        const merged = [];
        for (const entry of filtered) {
          if (merged.length > 0 && merged[merged.length - 1].speaker === entry.speaker) {
            merged[merged.length - 1].text += " " + entry.text;
          } else {
            merged.push({ ...entry });
          }
        }

        // Word-based: all spoken words before cleaning vs. after (filler sentences + um/uh)
        const rawWords = entries.reduce((sum, e) => sum + wc(e.text), 0);
        const cleanWords = merged.reduce((sum, r) => sum + wc(r.text), 0);

        return {
          rows: merged,
          fillerPct: rawWords > 0 ? Math.round(((rawWords - cleanWords) / rawWords) * 100) : 0,
        };
      }

      function talkSplit(rows, host) {
        let hostWords = 0,
          guestWords = 0;
        for (const row of rows) {
          if (row.speaker === host) hostWords += wc(row.text);
          else guestWords += wc(row.text);
        }
        const total = hostWords + guestWords;
        return {
          hostPct: total > 0 ? Math.round((hostWords / total) * 100) : 0,
          guestPct: total > 0 ? Math.round((guestWords / total) * 100) : 0,
        };
      }

      function esc(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function renderPreview(rows, host) {
        return rows
          .map((r) => {
            const line = `${esc(r.speaker)}: ${esc(r.text)}`;
            return r.speaker === host ? `<p><strong>${line}</strong></p>` : `<p>${line}</p>`;
          })
          .join("");
      }

      // Read rows back from the (possibly edited) contenteditable
      function getRowsFromPreview() {
        const rows = [];
        for (const p of document.getElementById("preview").querySelectorAll("p")) {
          const text = p.textContent.trim();
          if (!text) continue;
          const isHost = !!p.querySelector("strong, b"); // host lines are bold
          const sep = text.indexOf(": ");
          rows.push(sep > -1 ? { speaker: text.slice(0, sep), text: text.slice(sep + 2), isHost } : { speaker: "", text, isHost });
        }
        return rows;
      }

      function handleCopyForAI() {
        const transcript = guestText(getRowsFromPreview());

        const prompt =
          `Here is a cleaned interview transcript. Find the 5 most interesting, insightful, or quotable moments from the guest. ` +
          `For each, include the exact quote and one sentence on why it stands out.\n\n---\n\n${transcript}`;

        navigator.clipboard.writeText(prompt).then(() => {
          const btn = document.getElementById("copy-btn");
          const label = btn.dataset.label || (btn.dataset.label = btn.textContent);
          btn.textContent = "Copied!";
          setTimeout(() => (btn.textContent = label), 2000);
        });
      }

      // Guest lines only, no speaker labels
      function guestText(rows) {
        return rows
          .filter((r) => !r.isHost && r.text)
          .map((r) => r.text)
          .join("\n\n");
      }

      function handleGuestTxt() {
        const rows = getRowsFromPreview();
        const guestNames = [...new Set(rows.filter((r) => !r.isHost && r.speaker).map((r) => r.speaker))];
        const slug = (guestNames[0] || "guest").replace(/\s+/g, "_");
        download(guestText(rows), `${baseFilename}_CLEANED_${slug}_ONLY.txt`, "text/plain");
      }

      // Full conversation as Markdown under a title: host lines fully bold, guest lines plain
      function handleMarkdown() {
        const mdEsc = (s) => s.replace(/([\\*_`])/g, "\\$1");
        const body = getRowsFromPreview()
          .filter((r) => r.text)
          .map((r) => {
            const line = r.speaker ? `${mdEsc(r.speaker)}: ${mdEsc(r.text)}` : mdEsc(r.text);
            return r.isHost ? `**${line}**` : line;
          })
          .join("\n\n");
        download(`# ${mdEsc(baseFilename)}\n\n${body}\n`, `${baseFilename}_CLEANED.md`, "text/markdown");
      }

      function download(content, filename, type) {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      }

      function setState(state, message) {
        const dz = document.getElementById("dropzone");
        dz.className = state || "";
        if (message) document.getElementById("status").innerHTML = message;
      }

      function render() {
        const { rows, fillerPct, displayName } = loaded;
        const host = document.getElementById("host-select").value;
        const { hostPct, guestPct } = talkSplit(rows, host);

        const guestNames = [...new Set(rows.filter((r) => r.speaker !== host).map((r) => r.speaker))];
        const labelName = guestNames.length === 1 ? guestNames[0] : "guests";
        document.getElementById("guest-txt-btn").textContent = `Download ${labelName} only .txt`;

        document.getElementById("preview").innerHTML = renderPreview(rows, host);
        setState(
          "",
          `${rows.length} speaker turns &middot; ${esc(host)}: ${hostPct}% &middot; ${esc(labelName)}: ${guestPct}% &middot; ${fillerPct}% of words were filler &middot; ${esc(displayName)}`,
        );
      }

      function processFile(file, folderName) {
        if (!file || !file.name.endsWith(".txt")) {
          setState("error", "Please drop a <strong>.txt</strong> file or Zoom folder");
          return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const entries = parse(e.target.result);
            if (entries.length === 0) {
              setState("error", "No transcript entries found. Is this a Zoom closed-caption file?");
              return;
            }

            const { rows, fillerPct } = clean(entries);
            baseFilename = folderName || file.name.replace(/\.txt$/i, "");
            loaded = { rows, fillerPct, displayName: folderName ? `📁 ${folderName}` : file.name };

            // Default host: last one picked in this browser if present, else the first speaker
            const speakers = [...new Set(rows.map((r) => r.speaker))];
            let saved = null;
            try {
              saved = localStorage.getItem(HOST_KEY);
            } catch {}
            const select = document.getElementById("host-select");
            select.innerHTML = speakers.map((s) => `<option>${esc(s)}</option>`).join("");
            select.value = speakers.includes(saved) ? saved : speakers[0];

            render();
            document.body.classList.add("loaded");
          } catch (err) {
            setState("error", `Error: ${err.message}`);
          }
        };
        reader.onerror = () => setState("error", "Could not read the file.");
        reader.readAsText(file);
      }

      document.getElementById("copy-btn").addEventListener("click", handleCopyForAI);
      document.getElementById("host-select").addEventListener("change", (e) => {
        try {
          localStorage.setItem(HOST_KEY, e.target.value);
        } catch {}
        if (loaded) render();
      });
      document.getElementById("guest-txt-btn").addEventListener("click", handleGuestTxt);
      document.getElementById("md-btn").addEventListener("click", handleMarkdown);
      document.getElementById("file-input").addEventListener("change", (e) => {
        processFile(e.target.files[0]);
        e.target.value = "";
      });

      document.addEventListener("dragover", (e) => {
        e.preventDefault();
        document.getElementById("dropzone").classList.add("dragover");
      });

      document.addEventListener("dragleave", (e) => {
        if (!e.relatedTarget) document.getElementById("dropzone").classList.remove("dragover");
      });

      document.addEventListener("drop", (e) => {
        e.preventDefault();
        document.getElementById("dropzone").classList.remove("dragover");

        const item = e.dataTransfer.items && e.dataTransfer.items[0];
        const entry = item && item.webkitGetAsEntry && item.webkitGetAsEntry();

        if (entry && entry.isDirectory) {
          const folderName = entry.name;
          entry.createReader().readEntries(
            (children) => {
              const txtEntry = children.find((c) => c.isFile && c.name.endsWith(".txt"));
              if (!txtEntry) {
                setState("error", "No .txt file found inside the dropped folder");
                return;
              }
              txtEntry.file((file) => processFile(file, folderName));
            },
            () => setState("error", "Could not read the dropped folder"),
          );
        } else {
          processFile(e.dataTransfer.files[0]);
        }
      });
    </script>
  </body>
</html>
